[project]
name = "agent-memory"
version = "0.1.1"
description = "Persistent per-project memory for coding agents (Claude Code): facts, decisions and rules with sources, read automatically, written by one executor."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
ignore = ["F841"]
